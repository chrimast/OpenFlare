            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "404":
          description: 文件不存在
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
