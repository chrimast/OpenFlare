info:
  contact:
    name: OpenFlare
    url: https://github.com/Rain-kl/OpenFlare
  description: OpenFlare 平台后端 API，提供用户认证、系统配置、任务调度与边缘节点管理能力。
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: OpenFlare API
  version: 1.0.0
paths:
  /api/v1/admin/auth-sources:
    get:
      description: 返回所有已配置的 OAuth/OIDC 认证源列表，包括已启用和未启用的，需要管理员权限
      produces:
      - application/json
      responses:
        "200":
          description: 认证源列表
          schema:
            $ref: '#/definitions/response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 获取认证源列表
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 创建一个新的 OAuth/OIDC 认证源配置，认证源名称必须唯一且符合命名规范，需要管理员权限
      parameters:
      - description: 创建认证源参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/contracts.AuthSourceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功，返回认证源信息
          schema:
            $ref: '#/definitions/response.Any'
        "400":
          description: 参数错误或验证失败
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 创建认证源
      tags:
      - admin
  /api/v1/admin/auth-sources/{id}:
    delete:
      description: 删除指定认证源及其关联的所有外部帐号绑定记录，警告：删除后相关用户将无法通过该源登录，需要管理员权限
      parameters:
      - description: 认证源 ID 或名称
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: ID 无效或删除失败
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 删除认证源
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: 更新指定 ID 的认证源配置。若 client_secret 字段为空，则保留原有密钥不变，需要管理员权限
      parameters:
      - description: 认证源 ID 或名称
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: 更新认证源参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/contracts.AuthSourceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功，返回更新后的认证源信息
          schema:
            $ref: '#/definitions/response.Any'
        "400":
          description: 参数错误或验证失败
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 更新认证源
      tags:
      - admin
  /api/v1/admin/auth-sources/{id}/toggle:
    put:
      consumes:
      - application/json
      description: 启用或禁用指定认证源。尝试启用时将验证 Client ID 和 Client Secret 是否已配置，需要管理员权限
      parameters:
      - description: 认证源 ID 或名称
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 切换成功
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 验证失败或认证源不存在
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 切换认证源启用状态
      tags:
      - admin
  /api/v1/admin/automation/grants:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      summary: Revoke the current administrator's OAuth automation grants
      tags:
      - admin-automation
  /api/v1/admin/automation/mcp:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
            - properties:
                data:
                  $ref: '#/definitions/apps_openflare_automation.mcpSettingsResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      summary: Get MCP connection settings
      tags:
      - admin-automation
  /api/v1/admin/cache/clear:
    post:
      description: 清除系统磁盘缓存目录中的所有临时文件，并重置缓存容量和 Key 追踪数据
      produces:
      - application/json
      responses:
        "200":
          description: 清理成功
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 清空缓存
      tags:
      - admin
  /api/v1/admin/cache/config:
    post:
      consumes:
      - application/json
      description: 更改磁盘缓存最大容量限制、文件生存时间（TTL）以及是否启用 LRU 淘汰淘汰算法，并进行热更新
      parameters:
      - description: 缓存配置请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateCacheConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 更新缓存配置
      tags:
      - admin
  /api/v1/admin/cache/status:
    get:
      description: 获取当前系统磁盘缓存的使用情况（已占用字节、Key 数量等）与策略配置
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
            - properties:
                data:
                  $ref: '#/definitions/disk.Status'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: 内部错误
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 获取缓存状态
      tags:
      - admin
  /api/v1/admin/db-export:
    get:
      description: SQLite 时直接下载 .db 文件；PostgreSQL 时执行 pg_dump 并流式下载 .sql 文件，需要管理员权限
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 数据库文件
          schema:
            type: file
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "403":
          description: 无管理员权限
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
        "500":
          description: 导出失败
          schema:
            $ref: '#/definitions/github_com_Rain-kl_Wavelet_internal_shared_response.Any'
      security:
      - SessionCookie: []
      summary: 导出数据库
      tags:
      - admin
  /api/v1/admin/db-info:
    get:
      description: 返回当前使用的数据库类型（sqlite/postgres）、名称/路径及版本字符串，需要管理员权限
      produces:
